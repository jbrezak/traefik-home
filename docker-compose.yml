version: '3.8'

services:
  traefik-home:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traefik-home
    volumes:
      # Docker socket for reading container info
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # Mount custom CSS (copy from sample/custom.css and customize)
      - /home/traefik-home/custom.css:/usr/share/nginx/html/custom.css
      - /home/authentik/logonWallpaper.gif://usr/share/nginx/html/background.gif
      
    environment:
      # Custom CSS file
      - CUSTOM_CSS_URL=/custom.css
      
      # Custom page title
      - PAGE_TITLE=Camano Homelab
      
      # Custom background image (optional)
      # - CUSTOM_BACKGROUND_URL=/background.gif
      
      # Authentik logout URL
      - AUTHENTIK_LOGOUT_URL=http://auth.locker.local/flows/-/default/invalidation/
      
      # Display options
      - SHOW_FOOTER=true
      - SHOW_STATUS_DOT=true
      - OPEN_IN_NEW_TAB=false

      # DEBUGGING
      - VERBOSE=true
      
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-home.rule=Host(`locker.local`)"
      - "traefik.http.routers.traefik-home.entrypoints=web"
      - "traefik.http.services.traefik-home.loadbalancer.server.port=80"
      
      # Authentik forward auth middleware
      - "traefik.http.routers.traefik-home.middlewares=chain-authentik@file"
      
      # Traefik-home configuration
      - "traefik-home.show-footer=true"
      - "traefik-home.show-status-dot=true"
      - "traefik-home.sort-by=name"
      
      # External app: OpenMediaVault
      - "traefik-home.app.omv.enable=true"
      - "traefik-home.app.omv.alias=OpenMediaVault NAS"
      - "traefik-home.app.omv.icon=https://www.openmediavault.org/favicon.ico"
      - "traefik-home.app.omv.admin=true"
      
      # External app: Rclone
      - "traefik-home.app.rclone.enable=true"
      - "traefik-home.app.rclone.alias=Rclone WebUI"
      - "traefik-home.app.rclone.icon=https://rclone.org/img/logo_on_light__horizontal_color.svg"
      - "traefik-home.app.rclone.admin=true"

      # External app: Traefik UI
      - "traefik-home.app.traefik-ui.enable=true"
      - "traefik-home.app.traefik-ui.alias=Traefik"
      - "traefik-home.app.traefik-ui.icon=https://traefik.io/favicon.ico"
      - "traefik-home.app.traefik-ui.admin=true"

      # External app: Open WebUI (LLM chat on ollama.local) - Traefik routers ai-lan/ai-admin live in /home/traefik/dynamic/openwebui.yml
      - "traefik-home.app.ai-lan.enable=true"
      - "traefik-home.app.ai-lan.alias=AI Chat (Open WebUI)"
      - "traefik-home.app.ai-lan.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/open-webui.png"
      - "traefik-home.app.ai-admin.enable=true"
      - "traefik-home.app.ai-admin.alias=AI Chat admin (Open WebUI)"
      - "traefik-home.app.ai-admin.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/open-webui.png"
      - "traefik-home.app.ai-admin.admin=true"

      # External app: OMV CTerm
      - "traefik-home.app.cterm.enable=true"
      - "traefik-home.app.cterm.alias=Container Terminal"
      - "traefik-home.app.cterm.icon=https://www.docker.com/app/uploads/2024/02/cropped-docker-logo-favicon-270x270.png"
      - "traefik-home.app.cterm.admin=true"

      # External app: Home Assistant
      - "traefik-home.app.homeassistant.enable=true"
      - "traefik-home.app.homeassistant.admin=true"
      - "traefik-home.app.homeassistant.alias=Home Assistant"
      - "traefik-home.app.homeassistant.icon=https://www.home-assistant.io/images/favicon.ico"
      - "traefik-home.app.homeassistant.url=http://raspberrypi.local:8123/"

      # External app: ProxMox server
      - "traefik-home.app.pve.enable=true"
      - "traefik-home.app.pve.admin=true"
      - "traefik-home.app.pve.alias=ProxMox server (pve)"
      - "traefik-home.app.pve.icon=https://www.proxmox.com/favicon.ico"
      - "traefik-home.app.pve.url=http://pve.local:8006"

      # External app: Router - disabled by default
      - "traefik-home.app.router.enable=false"

      - "docker-mdns.enable=true"
      - "docker-mdns.host=cterm.locker.local omv.locker.local rclone.locker.local ai.locker.local ai-admin.locker.local ai.local"
      
    restart: unless-stopped
    networks:
      - proxy

  # Example Docker service
  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.locker.local`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.middlewares=chain-authentik@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik-home.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/traefik.png"
      - "traefik-home.alias=Who Am I"
      - "docker-mdns.enable=true"
      - "docker-mdns.host=whoami.locker.local whoami.local"
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
